# Solo YunoHost: /etc/nginx/conf.d/<tuo-dominio>.d/jukebox.conf (location dentro il server block già esistente)
# Queste location scavalcano SSOwat: /alexa è protetta dalla firma di Amazon,
# /s/ dalla firma HMAC con scadenza.

location = /alexa {
    access_by_lua_block { return }
    proxy_pass http://127.0.0.1:8099;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 1m;
}

location = /health {
    access_by_lua_block { return }
    proxy_pass http://127.0.0.1:8099;
}

location /s/ {
    access_by_lua_block { return }
    proxy_pass http://127.0.0.1:8099;
    proxy_set_header Host $host;
    proxy_read_timeout 90s;
}

# Episodi dei podcast: serviti dall'app mentre si scaricano, senza buffer di nginx.
location /p/ {
    access_by_lua_block { return }
    proxy_pass http://127.0.0.1:8099;
    proxy_set_header Host $host;
    proxy_set_header Range $http_range;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Il file vero lo serve nginx (Range incluso) dopo X-Accel-Redirect dall'app.
location /_jukebox_cache/ {
    access_by_lua_block { return }
    internal;
    alias /var/cache/jukebox/;
    types { audio/mp4 m4a; }
    add_header Cache-Control "private, max-age=86400";
}
