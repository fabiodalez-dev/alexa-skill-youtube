# Esempio per nginx standalone: /etc/nginx/sites-available/jukebox
# Sostituisci jukebox.example.com con il tuo dominio e i percorsi dei certificati.
# Alexa chiama l'endpoint in TLS 1.2: non limitare ssl_protocols al solo TLSv1.3.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jukebox.example.com;

    ssl_certificate     /etc/letsencrypt/live/jukebox.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jukebox.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /alexa {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        client_max_body_size 1m;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8099;
    }

    # Brani: l'app prepara il file e lo passa a nginx con X-Accel-Redirect.
    location /s/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }

    # Episodi dei podcast: serviti dall'app mentre si scaricano, senza buffer.
    location /p/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /_jukebox_cache/ {
        internal;
        alias /var/cache/jukebox/;
        types { audio/mp4 m4a; }
        add_header Cache-Control "private, max-age=86400";
    }

    location / {
        return 404;
    }
}
